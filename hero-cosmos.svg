      <stop offset=".2" stop-color="#78c1bf"/>
      <stop offset=".58" stop-color="#2d6b78"/>
      <stop offset="1" stop-color="#102e43"/>
    </radialGradient>
    <linearGradient id="rings" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76bbc3" stop-opacity="0"/>
      <stop offset=".22" stop-color="#9ce2df" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#d5d3a4" stop-opacity=".9"/>
      <stop offset=".78" stop-color="#7bb9c3" stop-opacity=".65"/>
      <stop offset="1" stop-color="#76bbc3" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="stars" width="180" height="140" patternUnits="userSpaceOnUse">
