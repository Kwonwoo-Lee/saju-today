    <ellipse rx="230" ry="60" fill="none" stroke="#bce3df" stroke-opacity=".32" stroke-width="3"/>
    <circle r="126" fill="#071923" opacity=".65"/>
    <circle r="116" fill="url(#planet)" stroke="#bfe3da" stroke-opacity=".48" stroke-width="3"/>
