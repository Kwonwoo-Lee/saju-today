      <circle cx="74" cy="48" r=".8" fill="#fff4d0" opacity=".65"/>
      <circle cx="128" cy="18" r="1" fill="#d0e9ff" opacity=".78"/>
      <circle cx="158" cy="96" r="1.4" fill="#fff" opacity=".72"/>
      <circle cx="42" cy="116" r=".7" fill="#b8d8ef" opacity=".66"/>
      <circle cx="112" cy="124" r=".6" fill="#fff" opacity=".62"/>
