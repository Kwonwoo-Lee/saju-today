  <path d="M-80 430 C280 160 500 520 850 250 S1450 120 2010 390" fill="none" stroke="#83d9df" stroke-opacity=".11" stroke-width="150" filter="url(#blur40)"/>
  <path d="M-80 610 C310 340 540 720 920 470 S1510 340 2010 570" fill="none" stroke="#d2b477" stroke-opacity=".07" stroke-width="80" filter="url(#blur18)"/>
