    <circle cx="1278" cy="112" r="3"/><circle cx="1440" cy="328" r="2"/><circle cx="1714" cy="164" r="2.8"/>
    <circle cx="1810" cy="492" r="2"/><circle cx="103" cy="822" r="2.2"/><circle cx="492" cy="884" r="2.7"/>
    <circle cx="1142" cy="824" r="2.4"/><circle cx="1584" cy="704" r="3"/><circle cx="1780" cy="912" r="2.5"/>
