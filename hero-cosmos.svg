    <circle cx="548" cy="390" r="5"/><circle cx="438" cy="482" r="3.5"/>
    <circle cx="1190" cy="240" r="4"/><circle cx="1288" cy="350" r="6"/><circle cx="1410" cy="288" r="4"/>
    <circle cx="1518" cy="374" r="5"/><circle cx="1600" cy="272" r="3.5"/>
  </g>

