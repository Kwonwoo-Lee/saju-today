<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152b"/>
      <stop offset="0.45" stop-color="#050914"/>
      <stop offset="1" stop-color="#071c24"/>
    </linearGradient>
    <radialGradient id="tealNebula" cx="22%" cy="30%" r="62%">
      <stop offset="0" stop-color="#83d9df" stop-opacity=".72"/>
      <stop offset=".18" stop-color="#2b8997" stop-opacity=".48"/>
      <stop offset=".58" stop-color="#0e4d62" stop-opacity=".18"/>
      <stop offset="1" stop-color="#0a1c2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueNebula" cx="76%" cy="18%" r="60%">
      <stop offset="0" stop-color="#6bb7dc" stop-opacity=".38"/>
      <stop offset=".34" stop-color="#245a83" stop-opacity=".2"/>
      <stop offset="1" stop-color="#07152b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldHaze" cx="82%" cy="78%" r="48%">
      <stop offset="0" stop-color="#e3ae62" stop-opacity=".25"/>
      <stop offset=".38" stop-color="#a66e36" stop-opacity=".1"/>
      <stop offset="1" stop-color="#07152b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="32%" cy="26%" r="72%">
