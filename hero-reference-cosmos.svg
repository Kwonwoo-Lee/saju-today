<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a25"/><stop offset=".46" stop-color="#06141e"/><stop offset="1" stop-color="#02070d"/>
    </linearGradient>
    <radialGradient id="cloudA" cx="45%" cy="50%" r="55%">
      <stop offset="0" stop-color="#eaf6e7" stop-opacity=".76"/><stop offset=".08" stop-color="#94d8d1" stop-opacity=".62"/><stop offset=".32" stop-color="#2f8c93" stop-opacity=".34"/><stop offset="1" stop-color="#063b4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudB" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#9be2dd" stop-opacity=".42"/><stop offset=".26" stop-color="#267887" stop-opacity=".24"/><stop offset="1" stop-color="#0b2836" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="29%" cy="24%" r="74%">
      <stop offset="0" stop-color="#e4fcf1"/><stop offset=".13" stop-color="#a2d7c6"/><stop offset=".4" stop-color="#4e938d"/><stop offset=".75" stop-color="#1b4d5b"/><stop offset="1" stop-color="#071c2d"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#75c7c8" stop-opacity="0"/><stop offset=".19" stop-color="#b9e2d0" stop-opacity=".65"/><stop offset=".48" stop-color="#f0d79a" stop-opacity=".84"/><stop offset=".79" stop-color="#81bdc0" stop-opacity=".52"/><stop offset="1" stop-color="#75c7c8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur70"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="blur28"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="4" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 .14"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="mono" mode="screen"/>
    </filter>
    <pattern id="dust" width="170" height="130" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r=".8" fill="#e4ffff" opacity=".75"/><circle cx="39" cy="84" r=".65" fill="#fff3cd" opacity=".65"/>
      <circle cx="71" cy="30" r="1.1" fill="#d9f4ff" opacity=".7"/><circle cx="94" cy="108" r=".6" fill="#fff" opacity=".8"/>
      <circle cx="132" cy="54" r=".75" fill="#dff9ed" opacity=".64"/><circle cx="158" cy="16" r=".55" fill="#fff" opacity=".62"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <g filter="url(#blur70)">
    <ellipse cx="360" cy="360" rx="520" ry="360" fill="url(#cloudA)"/>
    <ellipse cx="1160" cy="220" rx="650" ry="300" fill="url(#cloudB)"/>
    <ellipse cx="1580" cy="760" rx="580" ry="330" fill="#185664" opacity=".32"/>
  </g>
  <g fill="none" stroke-linecap="round" filter="url(#blur28)">
    <path d="M-120 340 C160 100 390 600 710 350 S1220 60 1530 300 S1810 410 2060 150" stroke="#a8e6dc" stroke-opacity=".22" stroke-width="100"/>
    <path d="M-100 560 C250 300 490 790 860 510 S1370 280 2050 520" stroke="#1d8790" stroke-opacity=".25" stroke-width="88"/>
    <path d="M480 60 C700 350 1040 30 1280 240 S1650 520 2000 380" stroke="#d9f6ed" stroke-opacity=".13" stroke-width="42"/>
  </g>
  <g opacity=".28" filter="url(#grain)">
    <rect width="1920" height="1080" fill="url(#dust)"/>
    <circle cx="310" cy="340" r="170" fill="url(#cloudA)"/>
  </g>

  <g fill="#f8ffff" filter="url(#softGlow)">
    <circle cx="110" cy="125" r="3"/><circle cx="248" cy="480" r="2.3"/><circle cx="448" cy="168" r="2.7"/>
    <circle cx="612" cy="344" r="3.7"/><circle cx="772" cy="108" r="2.2"/><circle cx="986" cy="290" r="2.4"/>
    <circle cx="1210" cy="128" r="3"/><circle cx="1394" cy="262" r="2.4"/><circle cx="1640" cy="134" r="3.2"/>
    <circle cx="1782" cy="310" r="2.2"/><circle cx="1842" cy="720" r="2.8"/><circle cx="92" cy="790" r="2.5"/>
    <circle cx="420" cy="888" r="2.2"/><circle cx="1120" cy="850" r="2.8"/><circle cx="1502" cy="910" r="2.4"/>
  </g>

  <g fill="none" stroke="#d5f0ed" stroke-opacity=".5" stroke-width="2">
    <path d="M170 260 L300 350 L450 286 L526 438 L412 548 L300 350"/>
    <path d="M1220 270 L1314 366 L1430 306 L1536 396 L1620 286"/>
  </g>
  <g fill="#f3ffff" filter="url(#softGlow)">
    <circle cx="170" cy="260" r="5"/><circle cx="300" cy="350" r="7"/><circle cx="450" cy="286" r="4"/><circle cx="526" cy="438" r="5"/><circle cx="412" cy="548" r="3"/>
    <circle cx="1220" cy="270" r="4"/><circle cx="1314" cy="366" r="6"/><circle cx="1430" cy="306" r="4"/><circle cx="1536" cy="396" r="5"/><circle cx="1620" cy="286" r="3"/>
  </g>

  <g transform="translate(1510 720) rotate(-11)">
    <ellipse rx="260" ry="73" fill="none" stroke="#8bd4d1" stroke-opacity=".15" stroke-width="30" filter="url(#blur28)"/>
    <ellipse rx="248" ry="68" fill="none" stroke="url(#ring)" stroke-width="23" opacity=".75"/>
    <ellipse rx="226" ry="58" fill="none" stroke="#d7e9cf" stroke-opacity=".38" stroke-width="3"/>
    <circle r="130" fill="#061521" opacity=".72"/>
    <circle r="119" fill="url(#planet)" stroke="#c9eee0" stroke-opacity=".54" stroke-width="3"/>
    <path d="M-88 -37 C-28 -7 28 -50 87 -15 M-100 8 C-36 40 28 6 96 33 M-67 70 C-22 49 25 76 76 54" fill="none" stroke="#d9f8e9" stroke-opacity=".2" stroke-width="12"/>
    <ellipse rx="260" ry="73" fill="none" stroke="#f1d89e" stroke-opacity=".44" stroke-width="5" stroke-dasharray="32 22"/>
  </g>

  <g opacity=".42" fill="none" stroke="#d7ba72">
    <circle cx="910" cy="505" r="190" stroke-width="2" stroke-dasharray="2 17"/>
    <circle cx="910" cy="505" r="228" stroke-width="1" stroke-dasharray="1 13"/>
    <path d="M630 505H1190M910 225V785" stroke-opacity=".4"/>
  </g>
  <g fill="#f2d48b" opacity=".78"><circle cx="720" cy="505" r="5"/><circle cx="1100" cy="505" r="4"/><circle cx="910" cy="277" r="4"/></g>

  <path d="M0 1008 C260 976 430 1024 660 1000 C930 970 1120 1020 1370 992 C1590 968 1760 1004 1920 980 V1080 H0Z" fill="#02060a"/>
  <g transform="translate(960 965)" fill="#010307">
    <circle cx="0" cy="-106" r="18"/><path d="M-25-86 C-22-46 -28-20 -36 14 L-18 16 L-7-36 L-5 20 L12 20 L10-38 L30 12 L45 7 C28-28 24-56 22-88Z"/>
  </g>
  <rect width="1920" height="1080" fill="#02070b" opacity=".12"/>
